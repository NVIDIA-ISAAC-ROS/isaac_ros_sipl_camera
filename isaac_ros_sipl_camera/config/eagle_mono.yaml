---
# Default parameters for running VB1940 Eagle stereo camera as a single sensor mono camera
# VB1940 is a CoE stereo camera with 2560x1984 resolution @ 30fps

sipl_camera:
  ros__parameters:
    # Platform configuration
    platform_config: "VB1940_Camera"
    
    # CoE network configuration
    hsb_name: "hsb_0"
    hsb_id: 0
    interface_name: "mgbe0_0"
    ip_address: "192.168.0.2"       # Empty = use platform default
    mac_address: ""                 # Empty = use platform default
    
    # Output encoding
    encoding_desired: "nv12"
    
    # Timestamp configuration
    use_hw_timestamp: true
    
    # TF frame names
    camera_link_frame_name: "camera"

    # Camera calibration
    camera_info_url: "package://isaac_ros_sipl_camera/config/mock_mono_camera_info.yaml"


