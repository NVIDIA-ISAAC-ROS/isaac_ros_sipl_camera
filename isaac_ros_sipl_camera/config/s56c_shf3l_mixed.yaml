# S56C stereo + two independent SHF3L cameras captured by one SIPL node.
# Defaults to TRD1 G2A; launch query_config selects the adapter.
#
#   sensor 0/1  link 0  VB1940 L/R  RAW10   2560x1984 @30  -> ISP0 -> nv12
#   sensor 2    link 2  GW5         YUV422  1920x1536 @30  -> ICP  -> nv12
#   sensor 3    link 3  GW5         YUV422  1920x1536 @30  -> ICP  -> nv12
#
# Prerequisites:
#   - Sensing S56C and SGX_YUV_GMSL2 / GW5 drivers matching the JetPack release.
#   - YUV422-capable Camera HAL and S56C.nito from the Sensing driver package.
#   - Driver libraries and NITO file exposed to the ROS container.
#
# See the Sensing Thor setup guide for flashing, installation, and adapter selection:
#   docs/isaac_ros_docs/src/getting_started/sensors/sensing_thor_setup.rst

sipl_multi_camera:
  ros__parameters:
    platform_config_file: "package://isaac_ros_sipl_camera/config/s56c_shf3l_mixed_trd1_g2a.json"
    platform_config: "S56C_1_SHF3L_2"

    # Mask order: physical deserializer 1, then physical deserializer 0.
    link_mask: [0x0000, 0x000D]

    nito_file: "/var/nvidia/nvcam/settings/sipl/S56C.nito"

    # Frame sync uses the deserializer oscillator (osc_manual).
    enable_fsync_restart: false

    # Four sensors bring up sequentially; allow more slack than the 5s default.
    first_frame_timeout_s: 10.0

    enable_statistics: false
    statistics_interval_s: 60.0

    max_capture_to_publish_latency_frame_periods: 2.0

    # Extra capture buffers absorb short conversion stalls.
    capture_buffer_count: 8

    camera_link_frame_name: "rig"

    cameras: ["head_left", "head_right", "wrist_left", "wrist_right"]

    camera:
      head_left:
        topic_namespace: "head/left"
        sensor_id: 0
        output: "auto"
        frame_name: "head_stereo_camera_left"
        yuv_color_spec: "bt709"
        camera_info_url: "package://isaac_ros_sipl_camera/config/mock_s56c_left_camera_info.yaml"
      head_right:
        topic_namespace: "head/right"
        sensor_id: 1
        frame_name: "head_stereo_camera_right"
        yuv_color_spec: "bt709"
        camera_info_url: "package://isaac_ros_sipl_camera/config/mock_s56c_right_camera_info.yaml"
      # The robot URDF places the wrist cameras.
      wrist_left:
        topic_namespace: "wrist/left"
        sensor_id: 2
        frame_name: "left_wrist_camera"
        yuv_color_spec: "bt601"
        camera_info_url: "package://isaac_ros_sipl_camera/config/mock_shf3l_camera_info.yaml"
      wrist_right:
        topic_namespace: "wrist/right"
        sensor_id: 3
        frame_name: "right_wrist_camera"
        yuv_color_spec: "bt601"
        camera_info_url: "package://isaac_ros_sipl_camera/config/mock_shf3l_camera_info.yaml"

    stereo_pairs: ["head_left,head_right"]
    align_stereo_timestamps: true
    max_timestamp_diff_us: 1000.0
