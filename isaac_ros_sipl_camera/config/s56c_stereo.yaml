---
# S56C: VB1940 stereo, 2560x1984 at 30 FPS, RAW10 on link 0.

sipl_stereo_camera:
  ros__parameters:
    platform_config_file: "package://isaac_ros_sipl_camera/config/s56c_shf3l_mixed_trd1_g2a.json"
    platform_config: "S56C_1_SHF3L_2"

    # Mask order: physical deserializer 1, then physical deserializer 0.
    link_mask: [0x0000, 0x0001]

    nito_file: "/var/nvidia/nvcam/settings/sipl/S56C.nito"

    align_stereo_timestamps: true
    max_timestamp_diff_us: 1000.0

    # Frame sync uses the deserializer oscillator (osc_manual).
    enable_fsync_restart: false

    camera_link_frame_name: "s56c"
    left_camera_frame_name: "s56c_left"
    right_camera_frame_name: "s56c_right"

    camera_info_url: "package://isaac_ros_sipl_camera/config/mock_s56c_left_camera_info.yaml"
    right_camera_info_url: "package://isaac_ros_sipl_camera/config/mock_s56c_right_camera_info.yaml"
